---
gnome_vars:
  keyboard_shortcuts:
    - name: Terminal
      binding: <Control><Alt>t
      command: gnome-terminal

    - name: Flameshot
      binding: Print
      command: flameshot gui

  night_light:
    enabled: true
    temperature: 4500 # ranges from 1700 (very warm) to 4700 (less warm)

  weather:
    temperature_unit: centigrate # either centigrade or fahrenheit
    automatic_location: true
    locations: "[<(uint32 2, <('Waterloo', 'CYKF', true, [(0.75863645401796609, -1.402953824577011)], [(0.75863645401796609, -1.4055718184550026)])>)>]"

  desktop:
    # note: only wallpaper_filename is needed. 
    # If wallpaper_dark_filename is omitted, then wallpaper_filename is used for the dark theme wallpaper as well 
    wallpaper_filename: life_waves/life_waves_light_00.jpg # space-gooose-spacehawks.jpg
    wallpaper_dark_filename: life_waves/life_waves_dark_00.jpg # space-gooose-spacehawks.jpg
    screensaver_filename: life_waves/life_waves_light_00.jpg

    accent-color: pink # choices are: blue, teal, green, yellow, orange, red, pink, purple, slate
    prefer_dark_theme: true
    enable_hot_corners: false

    icon_theme: WhiteSur-dark # Gnome default is Adwaita
    cursor:
      size: 30 # Gnome default is 24
      theme: Bibata-Modern-Classic # Gnome default is Adwaita

    clock:
      show_weekday: true
      show_seconds: false
      show_date: true
      
    font:
      antialiasing: rgba  # Gnome default is 'grayscale'
      hinting: slight # Gnome default is 'slight'

      # https://rsms.me/inter/download/ for Inter font download. 
      # Apparently this will be Gnome's new default font going forward as of Gnome 47: https://www.omglinux.com/gnome-may-switch-to-inter-font/
      font_name: Inter 10           # Gnome default is 'Cantarell 11'
      document_font_name: Inter 10  # Gnome default is 'Cantarell 11'
      monospace_font_name: JetBrains Mono 10  # Gnome default is 'Monospace 11'
      titlebar_font: Inter Display Bold 10    # Gnome default is 'Cantarell Bold 11'

  favorite_apps:
    - google-chrome.desktop
    - org.gnome.Nautilus.desktop
    - org.gnome.Terminal.desktop
    - code.desktop

  gnome_extensions:
  # dconf settings for XYZ_name Gnome extension can be loaded with `dconf load /org/gnome/shell/extensions/XYZ_name/ < XYZ_name.ini`

  # dconf settings for XYZ_name Gnome extension can be dumped to an ini file with `dconf dump /org/gnome/shell/extensions/XYZ_name/ > XYZ_name.ini`

  # extensions below will be enabled by default, unless if enabled is set to false

    - name: blur-my-shell@aunetx
      dconf_file: blur-my-shell.ini
      dconf_entry: blur-my-shell

    - name: dash-to-panel@jderose9.github.com
      dconf_file: dash-to-panel.ini
      dconf_entry: dash-to-panel
      enabled: false

    - name: openweather-extension@jenslody.de
      dconf_file: openweather.ini
      dconf_entry: openweather
    
    - name: dash-to-dock@micxgx.gmail.com
      dconf_file: dash-to-dock.ini
      dconf_entry: dash-to-dock
