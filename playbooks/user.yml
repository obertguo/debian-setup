---
- name: Playbook to setup user configurations
  hosts: localhost
  vars_files:
  - ./playbook_vars/user_vars.yml
  - ./playbook_vars/apt_packages_list.yml
  - ./playbook_vars/sensitive_vars.yml

  tasks:
    - name: Backup existing user bashrc and copy over an updated one
      ansible.builtin.include_role:
        name: user
        tasks_from: bashrc

    - name: Template and copy gitconfig to user home directory
      ansible.builtin.include_role:
        name: user
        tasks_from: gitconfig
      vars:
        GITHUB_USERNAME: "{{ senstive_vars.gitconfig.username | default('', true) }}"
        GITHUB_PAT: "{{ senstive_vars.gitconfig.pat | default('', true) }}"
        GITHUB_EMAIL: "{{ senstive_vars.gitconfig.email | default('', true) }}"

    - name: Install additional fonts inside the fonts folder
      ansible.builtin.include_role:
        name: user
        tasks_from: fonts

    - name: Add VS code extensions and settings
      ansible.builtin.include_role:
        name: user
        tasks_from: vscode
      vars:
        vscode_extensions: "{{ user_vars.vscode_extensions | default([], true) }}"
    
    - name: Install Chrome extensions
      ansible.builtin.include_role:
        name: user
        tasks_from: chrome_extensions
      loop: "{{ user_vars.chrome_extensions | default([], true) }}"
      loop_control:
        label: item.extension_name
    
    - name: Register user profile picture in AccountsService
      ansible.builtin.include_role:
        name: user
        tasks_from: profile_picture
      vars:
        profile_picture: "{{ user_vars.profile_picture | default('') }}"
