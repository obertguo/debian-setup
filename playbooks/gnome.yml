---
- name: Playbook to configure Gnome DE
  hosts: localhost
  vars_files:
    - ./playbook_vars/gnome_vars.yml
    - ./playbook_vars/apt_packages_list_vars.yml

  tasks: 
    - name: Install Gnome related packages
      ansible.builtin.include_role:
        name: apt
        tasks_from: install_apt_package_list
      loop: 
        - "{{ apt_packages_list_vars.gnome }}"
      loop_control:
        loop_var: package_list

    - name: Configure custom keyboard shortcuts
      block:
        # Hacky way to avoid duplicate entries if this gets re-run
        # A proper removal/reset would be dconf write KEY "@as []" which is done below. 
        # This just sets the KEY to an empty string "" instead of "@as []" for an empty array. But, the logic becomes nicer when we call the keyboard_shortcuts role
      - name: Reset custom shortcuts
        ansible.builtin.shell:
          cmd: dconf reset /org/gnome/settings-daemon/plugins/media-keys/custom-keybindings

        # We'll bind PrintScreen to Flameshot as a custom keyboard shortcut later instead
      - name: Disable default Gnome Screenshot PrintScreen shortcut
        ansible.builtin.shell:
          cmd: dconf write /org/gnome/shell/keybindings/show-screenshot-ui '@as []'

      - name: Add user-defined custom shortcuts
        ansible.builtin.include_role:
          name: gnome
          tasks_from: keyboard_shortcuts
        loop: "{{ gnome_vars.keyboard_shortcuts }}"
        loop_control:
          index_var: index_var
          label: "{{ item.name }}"
      tags: ['gnome_keyboard_shortcuts', 'keyboard_shortcuts']

    - name: Set user desktop preferences
      ansible.builtin.include_role:
        name: gnome
        tasks_from: desktop
        apply:
          tags: ['gnome_desktop', 'desktop']
      vars:
        wallpaper_filename: "{{ gnome_vars.desktop.wallpaper_filename | default('') }}"
        wallpaper_dark_filename: "{{ gnome_vars.desktop.wallpaper_dark_filename | default(wallpaper_filename) }}"
        screensaver_filename: "{{ gnome_vars.desktop.screensaver_filename | default('') }}"
        accent_color: "{{ gnome_vars.desktop.accent_color | default('blue', true) }}"
        prefer_dark_theme: "{{ gnome_vars.desktop.prefer_dark_theme | default(false) | bool }}"
        enable_hot_corners: "{{ gnome_vars.desktop.enable_hot_corners | default(true) | bool }}"
        clock: "{{ gnome_vars.desktop.clock }}"
      tags: ['gnome_desktop', 'desktop']

    - name: Set user night light preferences
      ansible.builtin.include_role:
        name: gnome
        tasks_from: night_light
        apply: 
          tags: ['gnome_night_light', 'night_light']
      vars:
        night_light: "{{ gnome_vars.night_light }}"
      tags: ['gnome_night_light', 'night_light']

    - name: Set user font settings
      ansible.builtin.include_role:
        name: gnome
        tasks_from: fonts
        apply:
          tags: ['gnome_font', 'font', 'gnome_fonts', 'fonts']
      vars:
        font: "{{ gnome_vars.desktop.font }}"
      tags: ['gnome_font', 'font', 'gnome_fonts', 'fonts']
    
    - name: Install and set user cursor theme
      ansible.builtin.include_role:
        name: gnome
        tasks_from: cursor
        apply:
          tags: ['gnome_cursor', 'cursor']
      vars:
        cursor: "{{ gnome_vars.desktop.cursor }}"
      tags: ['gnome_cursor', 'cursor']
      
    - name: Install and set user icon theme
      ansible.builtin.include_role:
        name: gnome
        tasks_from: icon
        apply:
          tags: ['gnome_icon', 'icon']
      vars:
        icon_theme: "{{ gnome_vars.desktop.icon_theme }}"
      tags: ['gnome_icon', 'icon']

    - name: Configure Nautilus preferences
      ansible.builtin.include_role:
        name: gnome
        tasks_from: nautilus
        apply:
          tags: ['gnome_nautilus', 'nautilus']
      tags: ['gnome_nautilus', 'nautilus']
    
    - name: Reset and set user favorite-apps
      block:
        - name: Reset favorite apps
          ansible.builtin.shell:
            cmd: dconf reset /org/gnome/shell/favorite-apps
            
        - name: Set user favorite-apps
          ansible.builtin.include_role:
            name: gnome
            tasks_from: favorite_apps
          loop: "{{ gnome_vars.favorite_apps | default([], true) }}"
      tags: ['gnome_favorite_apps', 'favorite_apps']

    - name: Install and configure Gnome extensions
      block:
        - name: Install Gnome extensions
          ansible.builtin.include_role:
            name: gnome
            tasks_from: install_gnome_extensions
          loop: "{{ gnome_vars.gnome_extensions | default([], true) }}"

        - name: Configure Gnome extensions
          ansible.builtin.include_role:
            name: gnome
            tasks_from: configure_gnome_extensions
          loop: "{{ gnome_vars.gnome_extensions | default([], true) }}"
      tags: 
        - gnome_install_gnome_extensions
        - install_gnome_extensions
        - gnome_configure_gnome_extensions
        - configure_gnome_extensions
        - gnome_extensions

    - name: Finalize miscellaneous settings
      ansible.builtin.include_role:
        name: gnome
        tasks_from: misc_settings
        apply:
          tags: ['gnome_misc_settings', 'misc_settings']
      vars:
        weather: "{{ gnome_vars.weather }}"
      tags: ['gnome_misc_settings', 'misc_settings']
